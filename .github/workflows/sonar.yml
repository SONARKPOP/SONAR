name: SONAR · collect, verify & deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect:
        description: Refresh YouTube data before deployment (requires YOUTUBE_API_KEY secret)
        type: boolean
        default: false
      boost_reads:
        description: Enable temporary 24-hour read budget (does not change live search budget)
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'
    - cron: '2-52/10 * * * *'
    - cron: '7,27,37,47,57 * * * *'
    - cron: '17 1-5,7-11,13-17,19-23 * * *'
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.collect || inputs.boost_reads))
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collector tests
        if: github.event_name == 'push'
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Validate registry and show budget estimate
        if: github.event_name != 'schedule' || github.event.schedule == '17 */6 * * *'
        run: |
          python -m collectors.groups validate
          python -m collectors.quota --estimate
      - name: Decide whether source data needs collection
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BEFORE: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          collect=true
          if [ "$EVENT_NAME" = "push" ] && [[ "$SOURCE_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$SOURCE_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # Checkout stays on latest main so the persistent quota ledger is
            # current. Scope must use the triggering source diff, not a newer
            # data-only bot commit that landed while this run was queued.
            if ! git cat-file -e "$SOURCE_BEFORE^{commit}" 2>/dev/null || ! git cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$SOURCE_BEFORE" "$SOURCE_SHA" --depth=2
            fi
            if git diff --quiet "$SOURCE_BEFORE" "$SOURCE_SHA" -- config collectors .github/workflows/sonar.yml; then collect=false; fi
          fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
      - name: Enable temporary general read budget
        if: github.event_name == 'workflow_dispatch' && inputs.boost_reads
        run: python -m collectors.quota --enable-read-boost
      - name: Refresh cached girl-group YouTube activity
        if: steps.scope.outputs.collect == 'true' && (github.event_name == 'push' || inputs.collect || github.event.schedule == '17 */6 * * *')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m collectors.channel_activity
      - name: Discover review-only channel and new-group candidates
        if: steps.scope.outputs.collect == 'true' && (github.event_name == 'push' || inputs.collect || github.event.schedule == '17 */6 * * *')
        run: python -m collectors.channel_candidates
      - name: Collect or refresh with persistent limits
        id: collect_data
        if: steps.scope.outputs.collect == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FULL: ${{ github.event_name == 'push' || inputs.collect || github.event.schedule == '17 */6 * * *' }}
          LIVE: ${{ github.event.schedule == '2-52/10 * * * *' }}
        shell: bash
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo '::error::Add the YOUTUBE_API_KEY repository secret to enable collection.'
            exit 1
          fi
          if [ "$FULL" = "true" ]; then
            python -m collectors.youtube --pages 1
          else
            if [ "$LIVE" = "true" ]; then
              python -m collectors.youtube --refresh-live
            fi
            python -m collectors.youtube --refresh-uploads
          fi
      - name: Refresh reviewed platform sources
        if: steps.collect_data.outcome == 'success' && (github.event_name != 'schedule' || github.event.schedule == '2-52/10 * * * *' || github.event.schedule == '17 */6 * * *')
        env:
          CHZZK_CLIENT_ID: ${{ secrets.CHZZK_CLIENT_ID }}
          CHZZK_CLIENT_SECRET: ${{ secrets.CHZZK_CLIENT_SECRET }}
        run: python -m collectors.chzzk
      - name: Commit data or quota ledger
        id: commit
        if: always()
        env:
          COLLECTION_OK: ${{ steps.collect_data.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$COLLECTION_OK" = "true" ]; then
            git add public/data
          elif [ -f public/data/collection-state.json ]; then
            git add public/data/collection-state.json
          fi
          changed=false
          if git diff --cached --name-only | grep -qv '^public/data/collection-state.json$'; then
            changed=true
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh SONAR indexes and API budget'
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=true
                break
              fi
              # Source updates can land while collection is running. Preserve
              # them by replaying our data-only commit; never force-push.
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
            done
            if [ "$pushed" != true ]; then
              echo '::error::Data could not be saved after concurrent updates.'
              exit 1
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: collect
    if: always() && (needs.collect.result == 'skipped' || (github.event_name == 'push' && needs.collect.result == 'success') || (needs.collect.result == 'success' && needs.collect.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m collectors.groups validate
      - run: python -m collectors.channel_activity --recalculate
      - run: python -m collectors.groups sync
      - run: python -m collectors.channel_database
      - run: pnpm test
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
